<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alcova ES Kiosk Slideshow</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#slideWindow {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#slideShow {
    position: absolute;
    width: 2160px;
    height: 3840px;
    border: none;
    background: #000;

    /*
       Oversized and centered so the Google Slides controls/buttons
       are cropped outside the visible screen.
       Increase scale slightly if controls still show.
    */
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1.08);
    transform-origin: center center;
}
</style>
</head>

<body oncontextmenu="return false;">

<div id="slideWindow">
    <iframe
        id="slideShow"
        src="https://docs.google.com/presentation/d/e/2PACX-1vQWdYlk0y-_Ibs9q1dQBVFAzmd2qhVSVen3OJubqEOQiG3Ngf3p821MWKWDIbzSz8sxVPDG7XkZP9CL/embed?start=true&loop=true&delayms=5000&rm=minimal"
        allowfullscreen>
    </iframe>
</div>

<script>
window.addEventListener(
    "contextmenu",
    function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    },
    true
);

    setInterval(function () {
    window.location.href =
        window.location.pathname +
        "?refresh=" +
        new Date().getTime();
}, 180000);
    
</script>

</body>
</html>
